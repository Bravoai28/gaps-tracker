<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F7F1">
  <meta name="description" content="A gentle meal & symptom tracker for the GAPS Introduction Diet.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GAPS Tracker">
  <title>GAPS Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar"></header>
    <main id="view" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar">
    <a href="#/" data-tab="today"><span class="ti">🏠</span><span>Today</span></a>
    <a href="#/history" data-tab="history"><span class="ti">📅</span><span>History</span></a>
    <a href="#/stages" data-tab="stages"><span class="ti">📖</span><span>Stages</span></a>
    <a href="#/settings" data-tab="settings"><span class="ti">⚙️</span><span>Settings</span></a>
  </nav>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
